name: Weekly Dependency Audit Fix

on:
  schedule:
    # 07:00 on Monday in Asia/Shanghai = 23:00 on Sunday UTC
    - cron: "00 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-fix:
    name: Audit Fix and Open PR
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0 version is determined from the packageManager field in package.json by default.

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependency
        run: pnpm install

      - name: Run audit fix
        continue-on-error: true
        run: pnpm audit --fix=update

      - name: Prune stale minimumReleaseAge excludes
        run: pnpm audit:prune-exclude

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "chore(deps): weekly audit fix"
          title: "chore(deps): weekly audit fix"
          body: |
            Automated weekly dependency maintenance.

            Workflow run: [${{ github.workflow }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          branch: chore/weekly-audit-fix
          delete-branch: true
          labels: |
            dependencies

      # Pushes and pull requests made with `GITHUB_TOKEN` start no `push` or `pull_request`
      # workflow, so the tests would not run on the pull request. A `workflow_dispatch` event
      # is the exception, and the run reports its checks on the head commit of the branch.
      - name: Run tests on the pull request branch
        if: ${{ steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.create-pr.outputs.pull-request-branch }}
        run: gh workflow run test.yml --ref "$BRANCH"
